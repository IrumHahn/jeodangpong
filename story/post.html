<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이야기 | 저당퐁 블로그</title>
    <meta name="description" content="저당 간식, 제품과 브랜드에 관한 저당퐁의 이야기를 읽어보세요.">
    <meta name="theme-color" content="#f2eadd">
    <link id="canonical" rel="canonical" href="https://irumhahn.github.io/jeodangpong/story/post.html">
    <script id="post-schema" type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","name":"저당퐁 이야기"}</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%239a4036%22/><text y=%22.86em%22 x=%2212%22 font-size=%2272%22>퐁</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="story.css">
    <link rel="stylesheet" href="../vintage.css">
    <script src="../script.js" defer></script>
  </head>
  <body class="story-post-page">
    <header class="site-header">
      <a class="logo" href="../index.html" aria-label="저당퐁 홈">저당<span>퐁!</span></a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span><span class="sr-only">메뉴 열기</span>
      </button>
      <nav id="site-menu" aria-label="주요 메뉴">
        <a href="../about.html">내 소개</a>
        <a href="../products.html">제품</a>
        <a class="is-current" href="./" aria-current="page">이야기</a>
        <a class="nav-contact" href="../contact.html">연락하기</a>
      </nav>
    </header>

    <main class="post-main">
      <div class="post-toolbar">
        <a class="post-back" href="index.html"><span aria-hidden="true">←</span> 모든 이야기</a>
        <span>JEODANGPONG JOURNAL</span>
      </div>
      <div id="main" aria-live="polite"></div>
    </main>

    <footer>
      <a class="logo footer-logo" href="../index.html">저당<span>퐁!</span></a>
      <div><p>저당과자 브랜드 저당퐁</p><p>© 2026 JEODANGPONG. ALL RIGHTS RESERVED.</p></div>
      <div class="footer-links">
        <a href="mailto:cole@rebrandb.com" target="_blank" rel="noopener noreferrer">cole@rebrandb.com</a>
        <a href="https://www.threads.net/@irum_han" target="_blank" rel="noopener noreferrer">@irum_han</a>
        <a href="index.html">모든 이야기</a>
      </div>
      <button class="to-top" type="button" aria-label="맨 위로 이동">↑</button>
    </footer>

    <script>
      (function(){
        var main = document.getElementById('main');
        function el(tag, cls, text){ var node = document.createElement(tag); if (cls) node.className = cls; if (text != null) node.textContent = text; return node; }
        function fmtDate(value){ var date = new Date(value + 'T00:00:00'); if (isNaN(date)) return value || ''; return date.getFullYear() + '. ' + String(date.getMonth() + 1).padStart(2, '0') + '. ' + String(date.getDate()).padStart(2, '0'); }

        function appendInline(parent, source){
          var text = String(source || '');
          var pattern = /\[([^\]]+)\]\(([^)\s]+)\)/g;
          var cursor = 0;
          var match;
          while ((match = pattern.exec(text)) !== null){
            parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
            var href = match[2];
            if (/^(https?:\/\/|\.\.\/|\.\/|\/)/.test(href)){
              var link = el('a', null, match[1]);
              link.href = href;
              if (/^https?:\/\//.test(href)){ link.target = '_blank'; link.rel = 'noopener noreferrer'; }
              parent.appendChild(link);
            } else { parent.appendChild(document.createTextNode(match[0])); }
            cursor = pattern.lastIndex;
          }
          parent.appendChild(document.createTextNode(text.slice(cursor)));
        }

        function renderBody(source){
          var box = el('div', 'post-body');
          String(source || '').replace(/\r\n/g, '\n').split(/\n\s*\n/).forEach(function(block){
            block = block.trim();
            if (!block) return;
            var lines = block.split('\n');
            if (lines.every(function(line){ return /^- /.test(line.trim()); })){
              var list = el('ul');
              lines.forEach(function(line){ var item = el('li'); appendInline(item, line.trim().slice(2)); list.appendChild(item); });
              box.appendChild(list);
            } else if (/^## /.test(block)) { box.appendChild(el('h2', null, block.slice(3).trim())); }
            else { var paragraph = el('p'); appendInline(paragraph, block); box.appendChild(paragraph); }
          });
          return box;
        }

        function notFound(){
          var box = el('div', 'post-not-found');
          box.appendChild(el('span', null, '404'));
          box.appendChild(el('h1', null, '글을 찾을 수 없습니다'));
          box.appendChild(el('p', null, '주소가 잘못되었거나 삭제된 글일 수 있어요.'));
          var link = el('a', 'button button-dark', '이야기 목록으로'); link.href = 'index.html'; box.appendChild(link);
          main.appendChild(box);
        }

        function extractFaqs(source){
          var section = String(source || '').split(/\n## 관련 FAQ\s*\n/i)[1];
          if (!section) return [];
          return section.split('\n').map(function(line){
            var match = line.trim().match(/^-[\s]+Q\.\s*(.+?)\s+A\.\s*(.+)$/);
            return match ? {question: match[1].trim(), answer: match[2].trim()} : null;
          }).filter(Boolean);
        }

        function setMeta(post){
          document.title = String(post.title || '이야기') + ' | 저당퐁 블로그';
          var description = document.querySelector('meta[name="description"]');
          if (description) description.setAttribute('content', String(post.summary || '').slice(0, 160));
          var postUrl = 'https://irumhahn.github.io/jeodangpong/story/post.html?id=' + encodeURIComponent(post.id || '');
          document.getElementById('canonical').setAttribute('href', postUrl);
          var graph = [{
            '@type': 'BlogPosting', headline: String(post.title || ''), datePublished: String(post.date || ''), dateModified: String(post.date || ''), description: String(post.summary || ''),
            keywords: Array.isArray(post.tags) ? post.tags.map(String).join(', ') : '', inLanguage: 'ko-KR', mainEntityOfPage: postUrl,
            author: {'@type': 'Organization', name: '저당퐁'}, publisher: {'@type': 'Organization', '@id': 'https://irumhahn.github.io/jeodangpong/#organization', name: '저당퐁'}
          }];
          var faqs = extractFaqs(post.body);
          if (faqs.length){ graph.push({'@type': 'FAQPage', mainEntity: faqs.map(function(faq){ return {'@type': 'Question', name: faq.question, acceptedAnswer: {'@type': 'Answer', text: faq.answer}}; })}); }
          document.getElementById('post-schema').textContent = JSON.stringify({'@context': 'https://schema.org', '@graph': graph});
        }

        function render(posts){
          var id = new URLSearchParams(location.search).get('id');
          posts = (Array.isArray(posts) ? posts : []).slice().sort(function(a,b){ return String(b.date || '').localeCompare(String(a.date || '')); });
          var index = posts.findIndex(function(post){ return String(post.id) === id; });
          if (index < 0){ notFound(); return; }
          var post = posts[index];
          setMeta(post);
          var article = el('article', 'story-article');
          var head = el('header', 'post-head');
          var meta = el('div', 'post-meta');
          var time = el('time', null, fmtDate(post.date)); time.setAttribute('datetime', String(post.date || ''));
          meta.appendChild(time); meta.appendChild(el('span', null, '저당퐁 이야기'));
          head.appendChild(meta); head.appendChild(el('h1', null, String(post.title || '(제목 없음)')));
          if (post.summary) head.appendChild(el('p', 'post-summary', String(post.summary)));
          if (Array.isArray(post.tags) && post.tags.length){
            var tags = el('div', 'post-tags');
            post.tags.forEach(function(tag){ tags.appendChild(el('span', 'post-tag', String(tag))); });
            head.appendChild(tags);
          }
          article.appendChild(head); article.appendChild(renderBody(post.body));

          var previous = posts[index + 1];
          var next = posts[index - 1];
          if (previous || next){
            var navigation = el('div', 'post-navigation');
            navigation.setAttribute('role', 'navigation'); navigation.setAttribute('aria-label', '이전 글과 다음 글');
            function addLink(target, cls, label){
              if (!target){ navigation.appendChild(el('span', 'post-nav-empty')); return; }
              var link = el('a', cls); link.href = 'post.html?id=' + encodeURIComponent(target.id || '');
              link.appendChild(el('span', 'post-nav-label', label)); link.appendChild(el('strong', null, String(target.title || ''))); navigation.appendChild(link);
            }
            addLink(previous, 'post-nav-prev', '← 이전 글'); addLink(next, 'post-nav-next', '다음 글 →'); article.appendChild(navigation);
          }
          main.appendChild(article);
        }

        fetch('posts.json', {cache: 'no-store'})
          .then(function(response){ if (!response.ok) throw new Error(response.status); return response.json(); })
          .then(render)
          .catch(notFound);
      })();
    </script>
  </body>
</html>
