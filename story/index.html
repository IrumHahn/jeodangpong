<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>저당 간식과 브랜드 이야기 | 저당퐁 블로그</title>
    <meta name="description" content="혈당 관리, 저당 간식 선택법, 연근칩 제품 정보와 저당퐁의 브랜드 이야기를 사실에 근거해 전합니다.">
    <meta name="theme-color" content="#f2eadd">
    <link rel="canonical" href="https://irumhahn.github.io/jeodangpong/story/">
    <script id="blog-schema" type="application/ld+json">{"@context":"https://schema.org","@type":"Blog","name":"저당퐁 블로그"}</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%239a4036%22/><text y=%22.86em%22 x=%2212%22 font-size=%2272%22>퐁</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="story.css">
    <link rel="stylesheet" href="../vintage.css?v=20260828-final">
    <link rel="stylesheet" href="../assets/cart.css">
    <script src="../script.js?v=20260827-curation" defer></script>
  </head>
  <body class="story-page">
    <header class="site-header">
      <a class="logo" href="../index.html" aria-label="저당퐁 홈">저당<span>퐁!</span></a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span><span class="sr-only">메뉴 열기</span>
      </button>
      <nav id="site-menu" aria-label="주요 메뉴">
        <a href="../about.html">내 소개</a>
        <a href="../products.html">제품</a>
        <a class="is-current" href="./" aria-current="page">이야기</a>
        <a class="nav-contact" href="../contact.html">연락하기</a>
      </nav>
    </header>

    <main>
      <section class="story-page-hero">
        <div class="story-hero-copy reveal">
          <div class="section-label"><span>03</span> STORIES</div>
          <h1>저당퐁의<br><em>바삭한 이야기</em></h1>
          <p>간식을 고르는 기준부터 제품 뒤의 고민까지,<br>확인한 사실과 솔직한 경험을 차곡차곡 기록합니다.</p>
          <a class="button button-dark" href="#story-list">최신 이야기 읽기 <span aria-hidden="true">↓</span></a>
        </div>
        <span class="story-page-word" aria-hidden="true">STORY</span>
        <span class="story-pop story-pop-one" aria-hidden="true">?</span>
        <span class="story-pop story-pop-two" aria-hidden="true">퐁!</span>
      </section>

      <section class="story-archive section" id="story-list" aria-labelledby="story-list-title">
        <div class="story-archive-head reveal">
          <div class="section-label"><span>01</span> JOURNAL</div>
          <div><p>NEW &amp; HONEST</p><h2 id="story-list-title">모든 이야기</h2></div>
        </div>
        <ul class="story-list" id="list" aria-live="polite">
          <li class="story-list-status">이야기를 불러오는 중이에요…</li>
        </ul>
      </section>
    </main>

    <footer>
      <a class="logo footer-logo" href="../index.html">저당<span>퐁!</span></a>
      <div><p>저당과자 브랜드 저당퐁</p><p>© 2026 JEODANGPONG. ALL RIGHTS RESERVED.</p></div>
      <div class="footer-links">
        <a href="mailto:cole@rebrandb.com" target="_blank" rel="noopener noreferrer">cole@rebrandb.com</a>
        <a href="https://www.threads.net/@irum_han" target="_blank" rel="noopener noreferrer">@irum_han</a>
        <a href="admin.html">글 관리</a>
      </div>
      <button class="to-top" type="button" aria-label="맨 위로 이동">↑</button>
    </footer>

    <script>
      (function(){
        var list = document.getElementById('list');
        function el(tag, cls, text){ var node = document.createElement(tag); if (cls) node.className = cls; if (text != null) node.textContent = text; return node; }
        function fmtDate(value){ var date = new Date(value + 'T00:00:00'); if (isNaN(date)) return value || ''; return date.getFullYear() + '. ' + String(date.getMonth() + 1).padStart(2, '0') + '. ' + String(date.getDate()).padStart(2, '0'); }

        function render(posts){
          if (!Array.isArray(posts) || posts.length === 0){ list.replaceChildren(el('li', 'story-list-status', '첫 번째 이야기를 준비하고 있어요. 곧 만나요.')); return; }
          posts = posts.slice().sort(function(a,b){ return String(b.date || '').localeCompare(String(a.date || '')); });
          document.getElementById('blog-schema').textContent = JSON.stringify({
            '@context': 'https://schema.org', '@type': 'Blog', name: '저당퐁 블로그', url: 'https://irumhahn.github.io/jeodangpong/story/', inLanguage: 'ko-KR',
            publisher: {'@type': 'Organization', '@id': 'https://irumhahn.github.io/jeodangpong/#organization', name: '저당퐁'},
            blogPost: posts.map(function(post){ return {'@type': 'BlogPosting', headline: String(post.title || ''), description: String(post.summary || ''), datePublished: String(post.date || ''), url: 'https://irumhahn.github.io/jeodangpong/story/post.html?id=' + encodeURIComponent(post.id || '')}; })
          });
          list.replaceChildren();
          posts.forEach(function(post, index){
            var item = el('li', 'story-list-card');
            var link = el('a');
            link.href = 'post.html?id=' + encodeURIComponent(post.id || '');
            link.setAttribute('aria-label', String(post.title || '이야기') + ' 읽기');
            var content = el('div', 'story-card-content');
            var meta = el('div', 'story-card-meta');
            var time = el('time', null, fmtDate(post.date));
            time.setAttribute('datetime', String(post.date || ''));
            meta.appendChild(time);
            if (Array.isArray(post.tags) && post.tags.length){
              var tags = el('div', 'story-tags');
              post.tags.slice(0, 3).forEach(function(tag){ tags.appendChild(el('span', 'story-tag', String(tag))); });
              meta.appendChild(tags);
            }
            content.appendChild(meta);
            content.appendChild(el('h3', null, String(post.title || '(제목 없음)')));
            if (post.summary) content.appendChild(el('p', 'story-summary', String(post.summary)));
            link.append(el('span', 'story-number', String(index + 1).padStart(2, '0')), content, el('span', 'story-arrow', '↗'));
            item.appendChild(link);
            list.appendChild(item);
          });
        }

        fetch('posts.json', {cache: 'no-store'})
          .then(function(response){ if (!response.ok) throw new Error(response.status); return response.json(); })
          .then(render)
          .catch(function(){ list.replaceChildren(el('li', 'story-list-status', '글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.')); });
      })();
    </script>
    <script src="../assets/cart.js" defer></script>
  </body>
</html>
